<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 44px;
            height: 44px;
            padding: 10px;
            margin: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-toggle span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #333;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .menu-toggle[aria-expanded="true"] span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle[aria-expanded="true"] span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .nav-backdrop {
            display: none;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-backdrop {
                display: block;
                position: fixed;
                inset: 0;
                top: 0;
                background: rgba(0, 0, 0, 0.35);
                z-index: 999;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 0.25s ease, visibility 0.25s ease;
            }

            .nav-backdrop.is-visible {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
            }

            .main-nav {
                position: fixed;
                top: 0;
                left: 0;
                width: min(300px, 88vw);
                height: 100vh;
                margin: 0;
                padding: calc(56px + 1.25rem) 1.25rem 1.5rem;
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(8px);
                z-index: 1000;
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.12);
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .main-nav.is-open {
                transform: translateX(0);
            }

            .main-nav ul {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.1rem;
            }

            header .main-nav {
                flex: 0 0 0;
                width: auto;
                min-width: 0;
                overflow: visible;
            }

            header .menu-toggle {
                position: relative;
                z-index: 1001;
            }

            .language-selector {
                position: relative;
                z-index: 1001;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="main-nav" class="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="index.html" data-key="home">Home</a></li>
                <li><a href="about.html" data-key="about">About</a></li>
                <!-- <li><a href="contact.html" data-key="contact">Contact</a></li> -->
                <li><a href="map.html" data-key="map">Map</a></li>
                <!-- <li><a href="news.html" data-key="news">News</a></li> -->
                <li><a href="work.html" data-key="work">Work</a></li>
                <li><a href="https://www.instagram.com/jjjhiker/" target="_blank" data-key="instagram">Instagram</a></li>
                <li><a href="https://www.linkedin.com/in/johnmasataka-xianfeng-jiang/" target="_blank" data-key="linkedin">LinkedIn</a></li>
            </ul>
        </nav>
        <div class="language-selector">
            <select id="language-select">
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
            </select>
        </div>
    </header>
    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>

    <main>
        <section class="news">
            <h1>News</h1>
            <div class="news-content">
                <article class="news-item">
                    <h2>Latest Updates</h2>
                    <p>Stay tuned for our latest projects and announcements.</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Copyright © - All Rights Reserved.</p>
    </footer>
    <script>
        (function initMobileNav() {
            const menuToggle = document.getElementById('menu-toggle');
            const mainNav = document.getElementById('main-nav');
            const navBackdrop = document.getElementById('nav-backdrop');
            if (!menuToggle || !mainNav || !navBackdrop) return;

            function setMenuOpen(open) {
                menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
                mainNav.classList.toggle('is-open', open);
                navBackdrop.classList.toggle('is-visible', open);
                navBackdrop.setAttribute('aria-hidden', open ? 'false' : 'true');
                document.body.classList.toggle('menu-open', open);
                if (open) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = '';
                }
            }

            function closeMenu() {
                setMenuOpen(false);
            }

            menuToggle.addEventListener('click', () => {
                setMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true');
            });

            navBackdrop.addEventListener('click', closeMenu);

            mainNav.querySelectorAll('a').forEach((link) => {
                link.addEventListener('click', closeMenu);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && menuToggle.getAttribute('aria-expanded') === 'true') {
                    closeMenu();
                }
            });

            window.matchMedia('(min-width: 769px)').addEventListener('change', (e) => {
                if (e.matches) closeMenu();
            });
        })();
    </script>
    <script src="script.js"></script>
</body>
</html>
